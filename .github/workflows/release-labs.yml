# Packs every lab folder as a zip and publishes them as a new release, so the
# book's links (…/releases/latest/download/<lab>.zip) download the newest copy
# in one click. The same pattern as the first edition's companion repositories,
# without a manual tag: a change to a lab on main is the release.
#
# A lab named in UPLOAD_LABS is one whose learner gives an AI its inputs as a
# file. Its zip leaves out answer-key/, so the answers never ride along, and
# holds inputs/ only as inputs.zip: one copy, and the one file to upload (and
# week/ as week.zip, for a lab whose final run sees only what a run reaches). Its
# per-task answer keys (answer-key/task-*.md) are published as assets of their
# own, one file per task, so the lab can link one task's key for a one-click
# download at that task's check step.
#
# Every other lab is zipped whole, except its per-task keys: a lab built before
# that pattern can still add a task with its own key, and every
# answer-key/task-*.md, in any lab, is published the same way.
name: Release labs

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/release-labs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each lab folder
        env:
          UPLOAD_LABS: "brightline-lab-ch0-1 brightline-lab-ch0-2 brightline-lab-ch0-3 brightline-lab-ch0-4 brightline-lab-ch01 brightline-lab-ch02 brightline-lab-ch03 brightline-lab-ch04 brightline-lab-ch05 brightline-lab-ch06 brightline-lab-ch07 brightline-lab-ch08 brightline-lab-ch09 brightline-lab-ch10 brightline-lab-ch11"
        run: |
          mkdir -p dist stage
          for dir in labs/*/; do
            name="$(basename "${dir%/}")"
            if [[ " $UPLOAD_LABS " == *" $name "* ]]; then
              # Staged under the lab's name, so the zip still unpacks into one folder named for the lab.
              cp -R "${dir%/}" "stage/$name"
              rm -rf "stage/$name/answer-key"
              # A lab whose runs attach subsets keeps its files loose, in files/ instead of inputs/.
              if [ -d "stage/$name/inputs" ]; then
                (cd "stage/$name" && zip -r -X -q inputs.zip inputs -x "*/.DS_Store" "*/.gitkeep" && rm -rf inputs)
              fi
              # A lab whose final run may see only what a run can reach keeps those files in week/, zipped the same way.
              if [ -d "stage/$name/week" ]; then
                (cd "stage/$name" && zip -r -X -q week.zip week -x "*/.DS_Store" "*/.gitkeep" && rm -rf week)
              fi
              (cd stage && zip -r -X -q "../dist/$name.zip" "$name" -x "*/.DS_Store" "*/.gitkeep")
            else
              # From inside labs/, so the zip unpacks into one folder named for the lab.
              # A per-task key never rides in a zip.
              (cd labs && zip -r -X -q "../dist/$name.zip" "$name" -x "*/.DS_Store" "*/.gitkeep" "$name/answer-key/task-*.md")
            fi
          done
          # Each task's answer key rides as its own asset, named for its lab, in every lab.
          for dir in labs/*/; do
            name="$(basename "${dir%/}")"
            for key in "labs/$name"/answer-key/task-*.md; do
              [ -e "$key" ] || continue
              cp "$key" "dist/$name-key-$(basename "$key")"
            done
          done
          ls -l dist

      - name: Publish the zips as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="labs-$(date -u +%Y-%m-%d-%H%M%S)"
          gh release create "$tag" dist/* \
            --title "Labs, $(date -u +%Y-%m-%d)" \
            --notes "Every lab folder of The AI Agent Factory, Second Edition, as a zip, and each task's answer key as its own file. The book links to the latest release, so a link always downloads the newest copy." \
            --latest

# Packs every lab folder as a zip and publishes them as a new release, so the
# book's links (…/releases/latest/download/<lab>.zip) download the newest copy
# in one click. The same pattern as the first edition's companion repositories,
# without a manual tag: a change to a lab on main is the release.
#
# A lab named in UPLOAD_LABS is one whose learner gives an AI its inputs as a
# file. Its zip leaves out answer-key/, so the answers never ride along, and
# holds inputs/ only as inputs.zip: one copy, and the one file to upload. Its
# per-task answer keys (answer-key/task-*.md) are published as assets of their
# own, one file per task, so the lab can link one task's key for a one-click
# download at that task's check step.
name: Release labs

on:
  push:
    branches: [main]
    paths:
      - "labs/**"
      - ".github/workflows/release-labs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip each lab folder
        env:
          UPLOAD_LABS: "brightline-lab-ch01"
        run: |
          mkdir -p dist stage
          for dir in labs/*/; do
            name="$(basename "${dir%/}")"
            if [[ " $UPLOAD_LABS " == *" $name "* ]]; then
              # Staged under the lab's name, so the zip still unpacks into one folder named for the lab.
              cp -R "${dir%/}" "stage/$name"
              rm -rf "stage/$name/answer-key"
              (cd "stage/$name" && zip -r -X -q inputs.zip inputs -x "*/.DS_Store" "*/.gitkeep" && rm -rf inputs)
              (cd stage && zip -r -X -q "../dist/$name.zip" "$name" -x "*/.DS_Store" "*/.gitkeep")
            else
              # From inside labs/, so the zip unpacks into one folder named for the lab.
              (cd labs && zip -r -X -q "../dist/$name.zip" "$name" -x "*/.DS_Store" "*/.gitkeep")
            fi
          done
          # Each task's answer key rides as its own asset, named for its lab.
          for name in $UPLOAD_LABS; do
            for key in "labs/$name"/answer-key/task-*.md; do
              [ -e "$key" ] || continue
              cp "$key" "dist/$name-key-$(basename "$key")"
            done
          done
          ls -l dist

      - name: Publish the zips as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="labs-$(date -u +%Y-%m-%d-%H%M%S)"
          gh release create "$tag" dist/* \
            --title "Labs, $(date -u +%Y-%m-%d)" \
            --notes "Every lab folder of The AI Agent Factory, Second Edition, as a zip, and each task's answer key as its own file. The book links to the latest release, so a link always downloads the newest copy." \
            --latest

[project]
name = "brightline-ap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.12.4"]

[dependency-groups]
dev = ["pytest==8.4.2", "pyright==1.1.407"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["brightline_ap", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brightline_ap"]

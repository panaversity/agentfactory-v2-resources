[project]
name = "brightline-ap"
version = "0.1.0"
description = "Python versions of the Brightline accounts payable scripts."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
typeCheckingMode = "strict"
include = ["brightline_ap", "tests", "../exercises"]
exclude = ["../exercises/sdk-shaped"]

[tool.ruff]
line-length = 100
